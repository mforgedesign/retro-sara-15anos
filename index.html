<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <title>Sara 15 Anos</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08090b; }
      #viewer { position: fixed; inset: 0; isolation: isolate; }
      #slideshow-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #status { position: absolute; inset: auto 24px 24px; z-index: 7; color: #f5f5f5; text-align: center; font-size: 14px; text-shadow: 0 1px 10px #000; pointer-events: none; }
      #status[hidden] { display: none; }
      #fullscreen-toggle {
        position: absolute; z-index: 7; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
        display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid rgb(255 255 255 / 32%);
        border-radius: 50%; color: #fff; background: rgb(12 14 18 / 42%); backdrop-filter: blur(12px);
        opacity: .68; cursor: pointer; transition: opacity 180ms ease, background 180ms ease;
      }
      #fullscreen-toggle:hover, #fullscreen-toggle:focus-visible { opacity: 1; background: rgb(12 14 18 / 76%); }
      #fullscreen-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      #intro { position: absolute; inset: 0; z-index: 2; background: #000; overflow: hidden; }
      #intro[hidden] { display: none; }
      #intro video { position: absolute; inset: 0; width: 100%; height: 100%; }
      #introBg { object-fit: cover; filter: blur(32px) brightness(.55); transform: scale(1.15); }
      #introFg { object-fit: contain; }
      #sparkle { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
      #start { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: #08090b; cursor: pointer; border: 0; color: #fff; }
      #start[hidden] { display: none; }
      #start .ic { display: grid; place-items: center; width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; border: 2px solid rgb(255 255 255 / 70%); font-size: 48px; padding-left: 8px; box-shadow: 0 0 60px rgb(255 220 150 / 35%); }
      #start small { display: block; margin-top: 20px; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
    </style>
  </head>
  <body>
    <main id="viewer" aria-label="Retrospectiva">
      <canvas id="slideshow-canvas"></canvas>
      <div id="intro" hidden>
        <video id="introBg" muted playsinline preload="auto" src="assets/abertura.mp4"></video>
        <video id="introFg" muted playsinline preload="auto" src="assets/abertura.mp4"></video>
      </div>
      <canvas id="sparkle"></canvas>
      <button id="start" type="button" aria-label="Iniciar retrospectiva"><div><div class="ic">▶</div><small>Iniciar retrospectiva</small></div></button>
      <p id="status" role="status" aria-live="polite">Carregando…</p>
      <button id="fullscreen-toggle" type="button" aria-label="Ativar tela cheia" title="Tela cheia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3" /></svg>
      </button>
    </main>
    <script type="module">
      import { createSlideshowEngine } from "./engine.js?v=7";

      const viewer = document.getElementById("viewer");
      const canvas = document.getElementById("slideshow-canvas");
      const status = document.getElementById("status");
      const fullscreenButton = document.getElementById("fullscreen-toggle");
      const intro = document.getElementById("intro");
      const vFg = document.getElementById("introFg");
      const vBg = document.getElementById("introBg");
      const startBtn = document.getElementById("start");
      const sparkle = document.getElementById("sparkle");
      const sctx = sparkle.getContext("2d");
      const maxDpr = 2;
      const sizeForViewport = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
        return { width: Math.max(2, Math.round(window.innerWidth * dpr)), height: Math.max(2, Math.round(window.innerHeight * dpr)) };
      };
      const engine = await createSlideshowEngine({ root: viewer, canvas, mode: "finite", ...sizeForViewport(), lazyPhotos: true, imageCacheSize: 4 });

      let phase = "idle";
      let startedAt = 0;
      let latestTime = 0;
      let ending = false;

      function showError(error) {
        status.textContent = "Não foi possível carregar (" + (error && error.message ? error.message : error) + "). Atualize a página (Ctrl+F5).";
        status.hidden = false;
        console.error("Retro error", error);
      }

      // Copiado do convite (Builder v8 / Sara15Anos-HP). K escala os tamanhos para telas grandes.
      let K = 1;
      function createSparkleParticles(w, h) {
        K = Math.max(1, Math.min(w, h) / 420);
        const particles = [];
        for (let i = 0; i < 45; i++) {
          particles.push({
            type: 'sparkle', x: Math.random() * w, y: Math.random() * h, size: 1 + Math.random() * 4,
            speedX: (Math.random() - 0.5) * 3, speedY: (Math.random() - 0.5) * 3, opacity: 0.3 + Math.random() * 0.7,
            rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.15,
            twinkleSpeed: 2 + Math.random() * 4, delay: Math.random() * 0.3
          });
        }
        for (let i = 0; i < 14; i++) {
          particles.push({
            type: 'bokeh', x: Math.random() * w, y: Math.random() * h, size: 15 + Math.random() * 50,
            speedX: (Math.random() - 0.5) * 1.5, speedY: -0.5 - Math.random() * 1.5,
            opacity: 0.08 + Math.random() * 0.15, delay: Math.random() * 0.2
          });
        }
        particles.push({ type: 'flare', x: w * 0.3, y: h * 0.4, angle: -0.4, length: w * 1.5, opacity: 0 });
        return particles;
      }

      function drawSparkleFrame(ctx, w, h, particles, progress, whiteAlpha) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = `rgba(255, 255, 255, ${whiteAlpha})`;
        ctx.fillRect(0, 0, w, h);
        for (const p of particles) {
          const localProgress = Math.max(0, Math.min(1, (progress - p.delay) / (1 - p.delay)));
          if (localProgress <= 0) continue;
          const alpha = p.opacity * localProgress;
          if (p.type === 'sparkle') {
            p.x += p.speedX * K; p.y += p.speedY * K; p.rotation += p.rotSpeed;
            const twinkle = 0.5 + 0.5 * Math.sin(localProgress * p.twinkleSpeed * Math.PI);
            const sz = p.size * K * (0.5 + localProgress) * twinkle;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
            ctx.globalAlpha = alpha * twinkle;
            ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(255, 255, 255, 0.9)'; ctx.shadowBlur = sz * 3;
            ctx.beginPath();
            for (let j = 0; j < 4; j++) {
              const angle = (j / 4) * Math.PI * 2 - Math.PI / 2;
              const nextAngle = ((j + 0.5) / 4) * Math.PI * 2 - Math.PI / 2;
              ctx.lineTo(Math.cos(angle) * sz * 2.5, Math.sin(angle) * sz * 2.5);
              ctx.lineTo(Math.cos(nextAngle) * sz * 0.4, Math.sin(nextAngle) * sz * 0.4);
            }
            ctx.closePath(); ctx.fill(); ctx.restore();
          } else if (p.type === 'bokeh') {
            p.x += p.speedX * K; p.y += p.speedY * K;
            const sz = p.size * K * (0.6 + localProgress * 0.4);
            ctx.save(); ctx.globalAlpha = alpha * localProgress;
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)'); grad.addColorStop(0.4, 'rgba(255, 255, 240, 0.3)'); grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          } else if (p.type === 'flare') {
            ctx.save(); ctx.globalAlpha = localProgress * 0.35; ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            const g = ctx.createLinearGradient(-p.length / 2, 0, p.length / 2, 0);
            g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.3, 'rgba(255,255,255,0.4)'); g.addColorStop(0.5, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.7, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g; const thickness = (6 + localProgress * 20) * K;
            ctx.fillRect(-p.length / 2, -thickness / 2, p.length, thickness); ctx.restore();
          }
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      }
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      // Mesmas fases do convite: 800ms de brilho ate o branco (p^2, alpha .95), segura no pico (.97) enquanto troca, 700ms inverso ((1-p)^2, alpha .9)
      function sparkleTransition(onPeak) {
        const w = (sparkle.width = window.innerWidth), h = (sparkle.height = window.innerHeight);
        const particles = createSparkleParticles(w, h);
        const FADE_IN_MS = 800, FADE_OUT_MS = 700;
        return new Promise((resolve) => {
          let peakReached = false, holdReleased = false, fadeOutStart = null;
          const start = performance.now();
          const release = () => { holdReleased = true; fadeOutStart = performance.now(); };
          function animate(now) {
            const elapsed = now - start;
            if (elapsed < FADE_IN_MS) {
              const e = (elapsed / FADE_IN_MS) ** 2;
              drawSparkleFrame(sctx, w, h, particles, e, e * 0.95);
              requestAnimationFrame(animate);
            } else if (!holdReleased) {
              if (!peakReached) { peakReached = true; Promise.resolve(onPeak()).then(release, release); }
              drawSparkleFrame(sctx, w, h, particles, 1, 0.97);
              requestAnimationFrame(animate);
            } else {
              const fe = now - fadeOutStart;
              if (fe >= FADE_OUT_MS) { sctx.clearRect(0, 0, w, h); resolve(); return; }
              const e = (1 - fe / FADE_OUT_MS) ** 2;
              drawSparkleFrame(sctx, w, h, particles, e, e * 0.9);
              requestAnimationFrame(animate);
            }
          }
          requestAnimationFrame(animate);
        });
      }

      // Transicao do convite como opcao das aleatorias: mesmo brilho do convite, sincronizado com o progresso da troca
      let ovKey = null, ovParticles = null;
      function overlayConvite(st) {
        const on = st.effectName === "convite_brilho" && st.effectIndex !== null && st.progress > 0 && st.progress < 1;
        if (!on) { if (ovKey !== null) { sctx.clearRect(0, 0, sparkle.width, sparkle.height); ovKey = null; } return; }
        const w = window.innerWidth, h = window.innerHeight;
        if (ovKey !== st.effectIndex) { sparkle.width = w; sparkle.height = h; ovParticles = createSparkleParticles(w, h); ovKey = st.effectIndex; }
        const p = st.progress;
        const e = p < 0.5 ? (p / 0.5) ** 2 : ((1 - p) / 0.5) ** 2;
        drawSparkleFrame(sctx, w, h, ovParticles, e, e * (p < 0.5 ? 0.95 : 0.9) + (p > 0.45 && p < 0.55 ? 0.02 : 0));
      }

      // ---- Fluxo: vídeo de abertura -> brilho -> fotos -> brilho -> vídeo ... ----
      async function paint(now) {
        if (phase !== "photos") return;
        try {
          latestTime = Math.min((now - startedAt) / 1000, engine.duration);
          await engine.prepareAt(latestTime);
          const st = engine.renderAt(latestTime);
          overlayConvite(st);
          engine.prepareAt(Math.min(latestTime + 4, engine.duration)).catch(() => {});
          if (latestTime >= engine.duration && !ending) { ending = true; playIntro(true); return; }
        } catch (error) { showError(error); }
        requestAnimationFrame(paint);
      }
      async function beginPhotos() {
        await engine.prepareAt(0);
        engine.renderAt(0);
        intro.hidden = true;
        vFg.pause(); vBg.pause();
        phase = "photos"; ending = false;
        startedAt = performance.now();
        requestAnimationFrame(paint);
      }
      async function showIntro() {
        phase = "video";
        vFg.currentTime = 0; vBg.currentTime = 0;
        intro.hidden = false;
        vBg.play().catch(() => {});
        vFg.play().catch(showError);
      }
      async function playIntro(withSparkle) {
        const done = new Promise((res) => { vFg.addEventListener("ended", res, { once: true }); });
        if (withSparkle) await sparkleTransition(showIntro); else await showIntro();
        await Promise.race([done, wait(((vFg.duration || 24) + 3) * 1000)]);
        await sparkleTransition(beginPhotos);
      }
      startBtn.addEventListener("click", async () => {
        startBtn.hidden = true;
        try { viewer.requestFullscreen().catch(() => {}); } catch {}
        engine.prepareAt(0).catch(showError);
        playIntro(false);
      });

      function syncFullscreenButton() {
        const fs = Boolean(document.fullscreenElement);
        fullscreenButton.setAttribute("aria-label", fs ? "Sair da tela cheia" : "Ativar tela cheia");
      }
      fullscreenButton.addEventListener("click", async () => {
        try { document.fullscreenElement ? await document.exitFullscreen() : await viewer.requestFullscreen(); } catch (error) { showError(error); }
      });
      document.addEventListener("fullscreenchange", syncFullscreenButton);
      window.addEventListener("resize", () => {
        const next = sizeForViewport();
        if (next.width === engine.width && next.height === engine.height) return;
        engine.resize(next.width, next.height);
        if (phase === "photos") engine.prepareAt(latestTime).then(() => engine.renderAt(latestTime)).catch(showError);
      }, { passive: true });

      status.hidden = true;
    </script>
  </body>
</html>
